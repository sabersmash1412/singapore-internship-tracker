name: Refresh internships
on:
  # cron-job.org dispatches this workflow every 30 minutes.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tracker-publisher
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python run.py update
      - name: Save collected history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/state.json data/jobs.json data/internships.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update Singapore internships'
            git push origin HEAD:main
          fi
      # Keep successful updates even when another employer feed is unavailable.
      # Fail after publishing so Actions failure notifications cover partial outages.
      - name: Check employer feed health
        run: python run.py check
