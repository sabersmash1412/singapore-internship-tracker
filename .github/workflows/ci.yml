name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tracker run.py
      - run: python run.py render
      - name: Check published artifacts are reproducible
        run: git diff --exit-code -- README.md data/jobs.json data/internships.csv
